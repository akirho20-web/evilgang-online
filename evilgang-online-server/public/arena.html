#wrap{position:relative;width:100%;max-width:800px;display:flex;flex-direction:column;align-items:center}
.tools{position:absolute;top:6px;right:6px;z-index:2;display:flex;gap:6px}
.tools button{width:36px;height:36px;border:0;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;font-size:18px;touch-action:manipulation}

#wrap.fsm canvas{width:min(100vw,calc((100vh - 140px)*800/380));border-radius:0}
#wrap.fsm .help{display:none}
@media (hover:hover) and (pointer:fine){#wrap.fsm .pad{display:none}#wrap.fsm canvas{width:min(100vw,calc(100vh*800/380))}}
canvas{width:100%;max-width:800px;aspect-ratio:800/380;border-radius:10px;background:#222;touch-action:none;image-rendering:pixelated}
.help{max-width:800px;font-size:.85rem;opacity:.8;margin:8px 0;text-align:center;line-height:1.5}
.pad{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px;max-width:800px}
.pad button{width:54px;height:50px;font-size:1rem;font-weight:700;border:0;border-radius:10px;background:var(--card);color:var(--fg);box-shadow:0 2px 0 rgba(0,0,0,.25);user-select:none;-webkit-user-select:none;touch-action:none}
.pad button:active{background:var(--ac);color:#fff}
.pad .atk{width:80px;background:var(--ac);color:#fff}
</style>
</head>

function racerStep(r,dt){const RC=RACE,pl=RC.pl;r.ph+=.25+r.v*.04;if(r.hitF>0)r.hitF--;
  if(r.fin){r.v*=.97;r.p+=r.v;return}

  if(r.ai){const lead=RC.racers.reduce((m,q)=>Math.max(m,q.p),0);tv*=r.skill*(r.p<pl.p-500?1.06:r.p>pl.p+700?.95:1);if(r.sta>r.staM*.5&&Math.random()<.02)r.sprint=60;if(r.sprint>0){r.sprint--;}}
